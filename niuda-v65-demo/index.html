<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f8"><title>NiuD.AI V6.5</title><style>html,body{margin:0;min-height:100%;background:#f3f5f8}.l{min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1769e8;font-weight:800;text-align:center}.l small{display:block;color:#8d96a5;margin-top:8px;font-weight:400}.spin{width:34px;height:34px;margin:0 auto 15px;border:3px solid #dbe7ff;border-top-color:#1769e8;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="l"><div><div class="spin"></div>NIUD.AI<small>正在载入生产级手机 Demo</small></div></div><script>(async()=>{const base='https://raw.githubusercontent.com/Danika-Wu/Linguaflow/main/niuda-v65-demo/chunks/';const files=['v2_00.txt','v2_01.txt','v2_02.txt','v2_03.txt','v2_04.txt','v2_05.txt','v2_06.txt','v2_07.txt'];const parts=await Promise.all(files.map(f=>fetch(base+f+'?v=20260805',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const s=parts.join('').trim();const u=Uint8Array.from(atob(s),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('unsupported');const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()})().catch(e=>{document.body.innerHTML='<div class="l"><div>Demo 加载失败<small>请刷新页面，或使用最新版 Safari / Chrome 浏览器</small></div></div>'})</script></body></html>
