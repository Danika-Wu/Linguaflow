  --green:#49c99b; --green-2:#133027; --red:#ff737c; --red-2:#3b1c22;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;justify-content:center}
button,input{font:inherit}
button{cursor:pointer}
.app-shell{width:min(100%,430px);min-height:100dvh;background:var(--bg);padding-bottom:84px;position:relative}
.topbar{height:64px;padding:0 12px;display:grid;grid-template-columns:58px 1fr 58px;align-items:center;position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-action{height:40px;border:0;border-radius:14px;background:var(--surface);color:var(--text);font-weight:900;box-shadow:var(--shadow);position:relative}
.top-action.has-dot::after{content:"";position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.logo{text-align:center;font-size:19px;font-weight:950;letter-spacing:-.4px}
.logo small{display:block;font-size:8px;color:var(--muted);letter-spacing:1.2px;margin-top:2px}
.main{padding:14px 13px 28px}
.bottom-nav{position:fixed;bottom:0;width:min(100%,430px);height:82px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);z-index:60;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{border:0;background:transparent;color:var(--muted);font-size:8px;display:grid;place-content:center;gap:3px;min-width:0}
.bottom-nav button .nav-icon{font-size:19px;line-height:1}.bottom-nav button.active{color:var(--blue);font-weight:900}
.hidden{display:none!important}
.page{animation:pageIn .18s ease}
@keyframes pageIn{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{border-radius:26px;padding:20px;color:#fff;background:linear-gradient(145deg,#101d33,#254a7d 65%,#172b49);box-shadow:0 20px 48px rgba(17,44,83,.18)}
.hero.purple{background:linear-gradient(145deg,#18122e,#44357b 65%,#28204e)}
.hero.cyan{background:linear-gradient(145deg,#071b24,#174657 65%,#11323f)}
.hero.danger{background:linear-gradient(145deg,#41171b,#7f2d34 65%,#511c22)}
.hero .eyebrow{font-size:9px;opacity:.72}.hero h1{font-size:29px;margin:8px 0 4px}.hero p{font-size:10px;line-height:1.6;opacity:.84;margin:0}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:17px}.hero-grid div{padding:10px 7px;background:rgba(255,255,255,.1);border-radius:14px}.hero-grid b{display:block;font-size:14px}.hero-grid span{font-size:8px;opacity:.74}
.layer-stack{display:grid;gap:10px;margin-top:12px}.layer{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.layer-head,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.layer-number{width:25px;height:25px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--blue);font-weight:950;font-size:10px}.layer-title{font-size:13px;font-weight:900}.layer-desc{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.5}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.metric{border-radius:18px;padding:13px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.metric label,.metric small{font-size:9px;color:var(--muted)}.metric b{display:block;font-size:19px;margin:5px 0 3px}
.section{display:flex;justify-content:space-between;align-items:flex-end;margin:19px 2px 9px}.section h2{font-size:17px;margin:0}.section button{border:0;background:transparent;color:var(--blue);font-size:9px;font-weight:900}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.title{font-size:14px;font-weight:900}.sub{font-size:9px;color:var(--muted);line-height:1.55;margin-top:3px}.muted{color:var(--muted)}

.badge.green{background:var(--green-2);color:var(--green)}.badge.red{background:var(--red-2);color:var(--red)}.badge.amber{background:var(--amber-2);color:var(--amber)}.badge.blue{background:var(--blue-2);color:var(--blue)}.badge.purple{background:var(--purple-2);color:var(--purple)}
.authority{padding:4px 7px;border-radius:8px;font-size:8px;font-weight:950}.authority.t0{background:#14213b;color:#fff}.authority.t1{background:#1769e8;color:#fff}.authority.t2{border:1px solid #8d9bad;color:#64748b;background:transparent}.authority.t3{border:1px solid #d79a38;color:var(--amber);background:var(--amber-2)}.authority.t4{background:var(--surface-2);color:var(--muted)}.authority.t5{background:var(--purple-2);color:var(--purple)}
.authority-row{display:flex;gap:5px;flex-wrap:wrap}.source-tag{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:10px;background:var(--surface-2);font-size:8px;color:var(--muted)}
.chev{font-size:22px;color:var(--muted)}
.strategy-card{cursor:pointer}.strategy-card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.stats div{padding-left:8px;border-left:2px solid var(--line)}.stats label{display:block;font-size:8px;color:var(--muted)}.stats b{font-size:12px}
.execution-card{border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line));position:relative;overflow:hidden}.execution-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.block-card{border-color:color-mix(in srgb,var(--red) 40%,var(--line));background:linear-gradient(180deg,var(--surface),var(--red-2))}.block-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--red-2);color:var(--red);font-size:21px}.reason-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;color:var(--red);word-break:break-all;margin-top:8px;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:13px;padding:11px 9px;background:var(--surface-2);color:var(--text);font-size:10px;font-weight:900}.btn.primary{background:var(--blue);color:#fff}.btn.purple{background:var(--purple);color:#fff}.btn.danger{background:var(--red-2);color:var(--red)}.btn.full{width:100%}
.kv{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:10px}.kv:last-child{border-bottom:0}.kv span{color:var(--muted)}.kv b{text-align:right;max-width:65%}
.gate{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.gate:last-child{border-bottom:0}.gate-icon{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;background:var(--green-2);color:var(--green);font-weight:950}.gate-icon.warn{background:var(--amber-2);color:var(--amber)}.gate-icon.block{background:var(--red-2);color:var(--red)}.gate b{font-size:11px}.gate span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.notice{border-radius:15px;padding:12px;font-size:9px;line-height:1.65;margin-bottom:11px;background:var(--amber-2);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,var(--line))}.notice.blue{background:var(--blue-2);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 25%,var(--line))}.notice.red{background:var(--red-2);color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,var(--line))}
.tabs,.seg{display:flex;gap:5px;overflow:auto;scrollbar-width:none}.seg{padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:15px;margin:11px 0 12px}.seg button,.tabs button{border:0;background:transparent;color:var(--muted);white-space:nowrap;font-size:9px;font-weight:850}.seg button{padding:8px 11px;border-radius:11px}.seg button.active{background:var(--text);color:var(--bg)}.tabs{gap:18px;border-bottom:1px solid var(--line);margin-bottom:12px}.tabs button{padding:10px 0 9px}.tabs button.active{color:var(--text);border-bottom:2px solid var(--blue)}
.status{text-align:center;padding:25px 18px}.orb{width:82px;height:82px;border-radius:28px;margin:0 auto 13px;display:grid;place-items:center;background:var(--blue-2);color:var(--blue);font-size:32px}.status h2{font-size:18px;margin:0 0 7px}.status p{font-size:10px;color:var(--muted);line-height:1.65;margin:0}.timer{display:inline-flex;margin-top:12px;padding:7px 11px;border-radius:99px;background:var(--surface-2);font-size:9px;color:var(--muted)}
.stock{font-size:18px;font-weight:950}.code{font-size:9px;color:var(--muted);margin-top:2px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cell{background:var(--surface-2);border-radius:13px;padding:9px}.cell label{display:block;font-size:8px;color:var(--muted)}.cell b{display:block;font-size:13px;margin-top:4px}
.data-drawer{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.data-drawer summary{cursor:pointer;color:var(--blue);font-size:9px;font-weight:900;list-style:none}.data-drawer summary::-webkit-details-marker{display:none}.drawer-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.drawer-grid div{background:var(--surface-2);border-radius:12px;padding:9px}.drawer-grid label{display:block;font-size:8px;color:var(--muted)}.drawer-grid b{font-size:10px;margin-top:4px;display:block}.dataset-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.search{display:flex;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:6px;box-shadow:var(--shadow)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:13px;padding:8px}.search button{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:0 14px;font-weight:900}.mode-hints{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0 12px}.mode-hint{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface)}.mode-hint.active{border-color:var(--blue);background:var(--blue-2)}.mode-hint b{display:block;font-size:10px}.mode-hint span{display:block;font-size:8px;color:var(--muted);margin-top:3px;line-height:1.5}
.subhead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin:-2px 0 12px}.subhead h1{text-align:center;font-size:17px;margin:0}.subhead button{border:0;border-radius:12px;background:var(--surface);color:var(--text);height:38px;font-size:20px}
.entry{display:flex;align-items:center;gap:12px;cursor:pointer}.entry-icon{width:43px;height:43px;border-radius:14px;background:var(--blue-2);color:var(--blue);display:grid;place-items:center;font-size:17px}.grow{flex:1;min-width:0}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.choice{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.choice button{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);padding:7px 9px;border-radius:10px;font-size:9px;font-weight:850}.choice button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.event{position:relative;padding:0 0 16px 21px}.event::before{content:"";position:absolute;left:5px;top:5px;bottom:-5px;width:1px;background:var(--line)}.event:last-child::before{display:none}.event-dot{position:absolute;left:0;top:2px;width:11px;height:11px;border-radius:50%;background:var(--blue);border:3px solid var(--surface)}.event h3{font-size:11px;margin:0}.event p{font-size:9px;color:var(--muted);line-height:1.55;margin:3px 0 0}
.license-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.license-row:last-child{border-bottom:0}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,10,18,.48);z-index:100;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(100%,430px);max-height:90dvh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:13px 16px 30px}.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 15px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(14px);opacity:0;background:var(--text);color:var(--bg);padding:9px 13px;border-radius:12px;font-size:10px;z-index:120;transition:.2s;white-space:nowrap;pointer-events:none}#toast.show{opacity:1;transform:translateX(-50%)}
.red{color:var(--red)!important}.green{color:var(--green)!important}.amber{color:var(--amber)!important}.blue{color:var(--blue)!important}.purple{color:var(--purple)!important}
/* Real loading skeleton */
.sk{position:relative;overflow:hidden;background:var(--surface-3);border-radius:14px}.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.36),transparent);animation:shimmer 1.1s infinite}@keyframes shimmer{100%{transform:translateX(100%)}}
.skeleton-topbar{gap:15px}.sk-icon{width:42px;height:38px}.sk-logo{height:22px;width:110px;justify-self:center}.skeleton-main{display:grid;gap:12px}.sk-hero{height:176px;border-radius:26px}.sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sk-card{height:86px}.sk-wide{height:104px}.skeleton-nav{align-items:center;padding:0 10px}.sk-nav{height:44px;margin:0 4px}
.noscript{position:fixed;inset:20px;display:grid;place-items:center;text-align:center;background:var(--surface);color:var(--text);z-index:200;border-radius:22px;padding:24px}
html[data-font="large"] .title{font-size:16px}html[data-font="large"] .sub,html[data-font="large"] .badge,html[data-font="large"] .gate span{font-size:10px}html[data-font="large"] .kv,html[data-font="large"] .gate b{font-size:12px}
@media(min-width:431px){body{padding:18px 0}.app-shell{border-radius:29px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.16)}.bottom-nav{bottom:18px;border-radius:0 0 29px 29px}}

/* V4.2 production-interaction additions */
:root{--rise:#d9434e;--fall:#0a9c6a;--warning:#b7750e;font-variant-numeric:tabular-nums}
html[data-theme="dark"]{--rise:#ff747e;--fall:#47c99a;--warning:#efb052}
body,.metric b,.cell b,.stats b,.price,.kv b,.live-countdown{font-variant-numeric:tabular-nums lining-nums}
.rise{color:var(--rise)!important}.fall{color:var(--fall)!important}.price{font-size:18px}
.term-row{display:flex;align-items:center;gap:8px}.term-row h1{margin-right:0}.term-help{width:25px;height:25px;border-radius:50%;border:1px solid rgba(255,255,255,.36);background:rgba(255,255,255,.12);color:#fff;font-weight:950}
.glass{background:rgba(255,255,255,.14)!important;color:#fff!important;border:1px solid rgba(255,255,255,.22)!important}
.live-countdown,.confirm-countdown{display:block;margin:10px 0;padding:9px 11px;border-radius:12px;background:var(--blue-2);color:var(--blue);font-size:10px;font-weight:900;text-align:center}
.live-countdown.expired,.confirm-countdown.expired{background:var(--surface-3);color:var(--muted)}
.expired-card{filter:grayscale(.72);opacity:.67}.expired-card .btn{pointer-events:none}
.btn:disabled{opacity:.48;cursor:not-allowed}.btn.secondary{background:var(--surface-2);border:1px solid var(--line);color:var(--text)}
.btn.equal-confirm{background:var(--blue-2);border:1px solid var(--blue);color:var(--blue)}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.cancel-strong,.continue-equal{min-height:46px;border:1px solid var(--line)}.cancel-strong{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}.continue-equal{background:var(--blue-2);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.confirmation-risk{padding:12px;border-radius:14px;margin:12px 0;background:var(--green-2);color:var(--green);font-size:10px;font-weight:800;line-height:1.55}.confirmation-risk.blocked{background:var(--red-2);color:var(--red)}
.why-drawer{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.why-drawer summary{list-style:none;color:var(--purple);font-size:9px;font-weight:950;cursor:pointer}.why-drawer summary::-webkit-details-marker{display:none}.evidence-group{margin-top:11px}.evidence-title{font-size:9px;font-weight:950;margin-bottom:7px}.evidence-row{padding:8px 0;border-bottom:1px solid var(--line)}.evidence-row span{display:block;font-size:9px;line-height:1.45}.evidence-row i{display:block;width:var(--evidence);height:3px;border-radius:99px;background:currentColor;margin-top:6px;opacity:.55}
.system-alert{border-radius:16px;padding:12px 13px;margin-bottom:11px;display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center}.system-alert b{font-size:11px}.system-alert span{font-size:9px;line-height:1.5}.system-alert button{grid-row:1/3;grid-column:2;border:0;border-radius:11px;padding:8px;background:rgba(255,255,255,.5);color:inherit;font-weight:900}.system-alert.danger{background:var(--red-2);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,var(--line))}.system-alert.warning{background:var(--amber-2);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,var(--line))}
.fresh{color:var(--green)!important}.stale{color:var(--red)!important;font-weight:950}
.risk-footer{margin:24px 6px 6px;color:var(--muted);font-size:8px;line-height:1.6;text-align:center;padding:12px;border-top:1px solid var(--line)}
.amber-strong{background:var(--amber-2);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 35%,var(--line))}
.state-preview::before{content:"状态预览";position:sticky;left:0;font-size:7px;color:var(--muted);align-self:center;padding-left:4px}
.modal-copy{font-size:11px;line-height:1.7;color:var(--muted)}.compact-modal{max-width:430px}.onboarding-modal{text-align:center}.onboarding-mark{display:inline-block;padding:6px 10px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:950;letter-spacing:1px}.onboarding-modal h2{font-size:23px}.onboarding-grid{text-align:left;margin:15px 0}.onboarding-grid .gate{padding:11px 0}


/* V4.3 commercialization, trust and suitability */

  function waterfallChart(code) {

    const numeric=publicQuantNumbersAllowed();
    return `<div class="waterfall"><div class="waterfall-title"><b>${isProDetail()?'DecisionValue瀑布':'净优势是怎样形成的'}</b><span>${numeric?(isProDetail()?'单位：bps':'加分减去成本和风险'):'公众默认定性展示'}</span></div>${items.map(([label,val,tone,tech,qual])=>`<div class="waterfall-row"><div><b>${label}</b>${isProDetail()?`<span>${tech}</span>`:''}</div><div class="waterfall-track"><i class="${tone}" style="--wf:${Math.max(10,Math.abs(val)/max*100)}%"></i></div><strong class="${val>=0?'rise':'fall'}">${numeric?`${val>=0?'+':''}${val}bps`:qual}</strong></div>`).join('')}<div class="waterfall-total"><div><b>${isProDetail()?'DecisionValue':'最终净优势'}</b><span>${numeric?`保守下界 +${d.lcb}bps`:'保守情景仍为正'}</span></div><strong>${numeric?`+${d.final}bps`:'较强'}</strong></div></div>`;

  }

  function showOnboarding() {
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal onboarding-modal"><div class="grab"></div><div class="onboarding-mark">NIUD.AI</div><h2>先看安全，再看机会</h2><p class="modal-copy">NiuD.AI默认是公众研究工具。你可以先使用持仓安全网和监管事实提醒，不需要连接券商，也不需要立即做风险测评。</p><div class="onboarding-grid">${gate('持仓安全网','输入代码即可订阅监管事实')}${gate('公众工具模式','具体个性化买卖建议默认锁定')}${gate('影子持仓','手动记录，不冒充券商账户')}${gate('历史表现','回测、影子和实盘分开披露')}</div><button class="btn primary full" data-action="onboarding-safety">先添加持仓预警</button><button class="btn secondary full" style="margin-top:8px" data-action="finish-onboarding">直接进入首页</button></section></div>`;
  }

  function showRiskAssessment() {
    const q=RISK_QUESTIONS[state.riskStep];
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="grab"></div><div class="row"><div><div class="title">风险偏好引导</div><div class="sub">第${state.riskStep+1}/${RISK_QUESTIONS.length}题 · 非正式适当性测评</div></div>${badge('轻量引导','amber')}</div><h2 class="question-title">${q.q}</h2><div class="answer-list">${q.options.map(([label,score])=>`<button data-action="risk-answer" data-score="${score}">${label}</button>`).join('')}</div><button class="btn secondary full" data-action="close-modal">退出测评</button></section></div>`;
  }

  function finishRiskAssessment() {
    const score=state.riskAnswers.reduce((a,b)=>a+b,0);
    state.riskProfile=score<=2?'conservative':score<=5?'balanced':'active';
    state.riskStep=0; state.riskAnswers=[]; state.onboardingSeen=true; persist();
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal onboarding-modal"><div class="grab"></div><div class="onboarding-mark">${riskProfile().label}</div><h2>风险偏好引导完成</h2><p class="modal-copy">${riskProfile().detail} 产品内仓位提示上限为${riskProfile().maxAllocation}%。这不能替代正式投资者适当性评估。</p><button class="btn primary full" data-action="close-modal">进入NiuD.AI</button></section></div>`;
  }

  function showLockedContent() {
    const assessment=state.riskProfile==='unknown';
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="grab"></div><div class="title">具体服务内容已锁定</div><div class="notice amber-strong">当前公众工具模式不会向公众开放个性化价格、仓位和执行时点。</div>${kv('平台业务资质','NOT_HELD','red')}${kv('你仍可使用','监管安全网、证据链预览、风险事实和影子持仓')}${assessment?`<div class="notice blue">你首次触碰了锁定内容。可以现在完成4题风险偏好引导，也可以稍后再做。</div>`:''}<div class="confirm-actions"><button class="btn cancel-strong" data-route="qualification">查看服务边界</button><button class="btn continue-equal" data-action="${assessment?'start-risk-assessment':'close-modal'}">${assessment?'完成风险偏好引导':'返回'}</button></div></section></div>`;
  }

  function showExecutionCard(code,strategy) {
    const s=STOCKS[code];
    if(!adviceAllowed()) {
      $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="grab"></div><div class="title">具体执行建议已锁定</div><div class="notice red">当前平台未持有证券投资咨询业务资格，公众工具模式不开放具体买入价、仓位和执行时点。</div>${kv('当前模式',platform().label,'blue')}${kv('证券投资咨询业务资格','NOT_HELD','red')}${kv('可用功能','研究证据、监管闸门、风险结构和影子持仓')}<div class="confirm-actions"><button class="btn cancel-strong" data-action="close-modal">返回研究卡</button><button class="btn continue-equal" data-route="qualification">查看商业路径</button></div></section></div>`;
      return;
    }
    if(state.riskProfile==='unknown'){ showRiskAssessment(); return; }
    const expiry=strategy==='tail'?state.tailExpiry:state.morningExpiry; const expired=Date.now()>=expiry; const blocked=s.regulatory!=='NORMAL'||s.lcb<=0||expired||state.network!=='online'; const fit=riskMatch(s);
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal confirmation-modal" role="dialog" aria-modal="true"><div class="grab"></div><div class="row"><div><div class="title">${blocked?'执行已阻断':'持牌合作流程预览'}</div><div class="sub">${s.name} ${code} · ${strategy}</div></div>${badge(blocked?'BLOCKED':'仅原型预览',blocked?'red':'purple')}</div><div class="confirmation-risk ${blocked?'blocked':''}">${blocked?'当前条件不允许进入人工执行。':fit.mismatch?`当前${s.allocation}%参考仓位高于你的${riskProfile().label}偏好上限${riskProfile().maxAllocation}%，需要额外风险确认。`:'当前无监管阻断，且仓位提示未超过产品内偏好上限。'}</div>${kv('DecisionValue',`+${s.dv}bps`,'blue')}${kv('置信区间下界',`+${s.lcb}bps`,'purple')}${kv('参考仓位',`${s.allocation}%总资产`)}${kv('风险退出价',s.stop)}${kv('监管状态',s.regulatory,s.regulatory==='NORMAL'?'green':'red')}<div class="confirm-countdown" data-countdown="${expiry}">${countdownText(expiry)}</div><div class="notice blue">该页面仅验证持牌合作后的交互结构，不代表当前平台可以对公众提供该服务。</div><div class="confirm-actions"><button class="btn cancel-strong" data-action="close-modal">取消，本次不执行</button><button class="btn continue-equal" data-action="confirm-execution" data-code="${code}" data-strategy="${strategy}" ${blocked?'disabled':''}>我已核对，继续预览</button></div></section></div>`;
  }

  function showFinalExecution(code,strategy) {
    const s=STOCKS[code];
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="grab"></div><div class="title">持牌合作执行记录预览</div><div class="sub">真实上线时应由持牌机构完成适当性、建议留痕和客户确认；当前仅验证交互。</div>${kv('证券',`${s.name} ${code}`)}${kv('方向','买入')}${kv('价格上限',s.limit)}${kv('建议仓位',`${s.allocation}%`)}${kv('自动下单','未启用','green')}<div class="confirm-actions"><button class="btn cancel-strong" data-action="close-modal">取消</button><button class="btn continue-equal" data-action="record-fill">记录券商结果</button></div></section></div>`;
  }


  function showAddShadow(code) {
    const s=STOCKS[code]||STOCKS['010823'];
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="grab"></div><div class="title">手动添加影子持仓</div><div class="sub">仅保存在本机，用于提醒和复盘，不连接券商。</div><label class="form-label">股票代码</label><input class="form-input" id="shadow-code" value="${code}"><label class="form-label">成本价</label><input class="form-input" id="shadow-cost" type="number" step="0.01" value="${state.stockCost||s.price}"><label class="form-label">持股数量</label><input class="form-input" id="shadow-shares" type="number" step="100" value="1000"><div class="confirm-actions"><button class="btn cancel-strong" data-action="close-modal">取消</button><button class="btn continue-equal" data-action="save-shadow">保存影子持仓</button></div></section></div>`;
  }

  function saveShadowPosition() {
    const code=$('#shadow-code')?.value.trim(); const cost=Number($('#shadow-cost')?.value); const shares=Number($('#shadow-shares')?.value);
    if(!/^\d{6}$/.test(code)||!cost||!shares){showToast('请完整填写代码、成本和数量');return;}
    const existing=state.shadowPositions.find(x=>x.code===code);
    if(existing){existing.cost=cost;existing.shares=shares;existing.day='手动更新';}
    else state.shadowPositions.unshift({code,strategy:'用户影子持仓',day:'第1日',shares,cost});
    state.noPositions=false;persist();$('#modal-root').innerHTML='';state.tab='tracking';state.route=null;state.trackTab='positions';render();showToast('影子持仓已保存');
  }

  function updateLiveUi() {
    $$('[data-relative-time]').forEach(el=>{const ts=Number(el.dataset.relativeTime);el.textContent=relativeTime(ts);el.classList.toggle('stale',freshnessClass(ts,60)==='stale');});
    $$('[data-countdown]').forEach(el=>{const ts=Number(el.dataset.countdown);el.textContent=countdownText(ts);const expired=Date.now()>=ts;el.classList.toggle('expired',expired);if(expired){const card=el.closest('[data-expiry-card]');if(card){card.classList.add('expired-card');const b=card.querySelector('[data-action="execution-card"]');if(b){b.disabled=true;b.textContent='计划已失效';}}}});
  }

  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-tab],[data-route],[data-action],[data-mode],[data-stock-tab],[data-setting]'); if(!t)return;
    if(t.dataset.tab){state.tab=t.dataset.tab;if(['morning','tail','medium'].includes(t.dataset.tab)){state.strategyVisited=true;state.forceFullHome=true;persist();}state.route=null;state.routeData=null;state.history=[];render();window.scrollTo(0,0);return;}
    if(t.dataset.route){$('#modal-root').innerHTML='';navigate(t.dataset.route,{code:t.dataset.code,strategy:t.dataset.strategy,index:Number(t.dataset.index||0),eventIndex:t.dataset.eventIndex!==undefined?Number(t.dataset.eventIndex):undefined});return;}
    if(t.dataset.mode){const[k,v]=t.dataset.mode.split(':');state[k]=v;render();return;}
    if(t.dataset.stockTab){state.stockTab=t.dataset.stockTab;render();return;}
    if(t.dataset.setting){const[k,v]=t.dataset.setting.split(':');state[k]=v;applySettings();render();showToast('设置已保存');return;}
    switch(t.dataset.action){
      case 'back':back();break;
      case 'execution-card':showExecutionCard(t.dataset.code,t.dataset.strategy);break;
      case 'locked-content':showLockedContent();break;
      case 'confirm-execution':showFinalExecution(t.dataset.code,t.dataset.strategy);break;
      case 'close-modal':$('#modal-root').innerHTML='';break;
      case 'record-fill':$('#modal-root').innerHTML='';showToast('已进入券商结果记录流程');break;
      case 'term-info':showTermInfo();break;
      case 'open-onboarding':showOnboarding();break;
      case 'finish-onboarding':state.onboardingSeen=true;persist();$('#modal-root').innerHTML='';showToast('引导完成');break;
      case 'onboarding-safety':state.onboardingSeen=true;persist();$('#modal-root').innerHTML='';navigate('safety-net');break;
      case 'load-more-medium':state.mediumVisible=Math.min(15,state.mediumVisible+5);render();break;
      case 'analyze-stock':{const p=parseStockInput($('#stock-input').value);if(!p){showToast('请输入6位代码或代码@成本价');return;}if(!STOCKS[p.code])STOCKS[p.code]={name:'演示证券',sector:'其他',price:10,chg:0,score:70,p5:60,p10:64,p15:66,buy:9.90,limit:10.05,stop:9.45,dv:28,lcb:5,regulatory:'NORMAL',license:'RESEARCH_ONLY',missing:1,allocation:5};state.stockInput=$('#stock-input').value.trim();state.stockCode=p.code;state.stockCost=p.cost;state.stockMode=p.cost?'held':'pre';state.stockTab='decision';render();break;}
      case 'scenario':{const s=t.dataset.scenario;if(s==='noPositions'){state.noPositions=!state.noPositions;state.network='online';}else if(s==='toolMode'){state.platformMode='tool';state.network='online';}else if(s==='partnerMode'){state.platformMode='partnerPreview';state.network='online';}else{state.network=s;state.noPositions=false;if(s==='online')state.dataTimestamp=Date.now()-3500;if(s==='stale')state.dataTimestamp=Date.now()-185000;}persist();render();showToast('状态预览已切换');break;}
      case 'start-risk-assessment':state.riskStep=0;state.riskAnswers=[];showRiskAssessment();break;
      case 'risk-answer':state.riskAnswers.push(Number(t.dataset.score));state.riskStep++;if(state.riskStep>=RISK_QUESTIONS.length)finishRiskAssessment();else showRiskAssessment();break;
      case 'skip-risk':state.onboardingSeen=true;persist();$('#modal-root').innerHTML='';showToast('可在“我”中完成风险偏好引导');break;
      case 'platform-mode':state.platformMode=t.dataset.platform;persist();render();showToast('原型模式已切换');break;
      case 'quant-policy':state.publicQuantPolicy=t.dataset.policy;persist();render();showToast('公众量化展示口径已切换');break;
      case 'expand-research-home':state.forceFullHome=true;persist();render();showToast('已展开完整研究首页');break;
      case 'performance-source':state.performanceSource=t.dataset.source;render();break;
      case 'performance-window':state.performanceWindow=t.dataset.window;render();break;
      case 'message-tab':state.messageTab=t.dataset.messageTab;render();break;
      case 'mark-read':state.unreadMessages=0;persist();render();showToast('消息已全部标记为已读');break;
      case 'message-open':{const m=MESSAGE_FEED.find(x=>x.id===Number(t.dataset.messageId));if(!m)break;if(m.action==='regulatory')navigate('regulatory',{eventIndex:m.eventIndex});else if(m.action==='position')navigate('position',{index:m.index||0});else navigate(m.action);break;}
      case 'toggle-notification':{const k=t.dataset.pref;state.notificationPrefs[k]=!state.notificationPrefs[k];persist();render();break;}
      case 'select-plan':state.plan=t.dataset.plan;persist();render();showToast(state.plan==='free'?'已切换免费版':'Pro研究版试用已开启');break;
      case 'subscribe-safety':{const code=$('#safety-input')?.value.trim();if(!/^\d{6}$/.test(code)){showToast('请输入6位股票代码');break;}if(state.safetyWatchlist.length>=(state.plan==='free'?3:30)&&!state.safetyWatchlist.includes(code)){showToast(state.plan==='free'?'免费版最多监测3只':'Pro研究版最多监测30只');break;}if(!state.safetyWatchlist.includes(code))state.safetyWatchlist.unshift(code);persist();render();showToast('已加入持仓安全网');break;}
      case 'remove-safety':state.safetyWatchlist=state.safetyWatchlist.filter(x=>x!==t.dataset.code);persist();render();showToast('已停止监测');break;
      case 'add-shadow':showAddShadow(t.dataset.code);break;
      case 'open-add-shadow':showAddShadow(state.stockCode);break;
      case 'save-shadow':saveShadowPosition();break;
      case 'toast':showToast(t.dataset.message||'操作已记录');break;
    }
  });

  window.addEventListener('error',e=>console.error('[NiuD.V4.5]',e.error||e.message));
  window.addEventListener('unhandledrejection',e=>console.error('[NiuD.V4.5 promise]',e.reason));

  applySettings();
  requestAnimationFrame(()=>{
    render();
    document.documentElement.dataset.appMounted='true';
    setInterval(updateLiveUi,1000);
    if(!state.onboardingSeen)setTimeout(showOnboarding,280);
    console.info(`[NiuD.AI] Demo V${APP_VERSION} mounted`);
  });
})();
</script>
</head>
<body>
  <div id="app-shell" class="app-shell" aria-live="polite">
    <header class="topbar skeleton-topbar" aria-label="正在加载顶部导航">
      <div class="sk sk-icon"></div>
      <div class="sk sk-logo"></div>
      <div class="sk sk-icon"></div>
    </header>
    <main class="main skeleton-main" aria-label="正在加载 NiuD.AI">
      <section class="sk sk-hero"></section>
      <section class="sk-grid">
        <div class="sk sk-card"></div><div class="sk sk-card"></div>
      </section>
      <section class="sk sk-wide"></section>
      <section class="sk sk-wide"></section>
      <section class="sk sk-wide"></section>
    </main>
    <nav class="bottom-nav skeleton-nav" aria-label="正在加载底部导航">
      <div class="sk sk-nav"></div><div class="sk sk-nav"></div><div class="sk sk-nav"></div>
      <div class="sk sk-nav"></div><div class="sk sk-nav"></div><div class="sk sk-nav"></div>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>
    <div class="noscript">此交互原型需要启用 JavaScript。</div>
  </noscript>
</body>
</html>
